name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install Lua (Hammerspoon module tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Syntax checks
        run: |
          node --check bin/revoice.js
          luac5.4 -p hammerspoon/revoice.lua
          bash -n install.sh
      - name: Tests
        run: npm test
